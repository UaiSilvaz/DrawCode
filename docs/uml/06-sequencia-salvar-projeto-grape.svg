<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 8; }
      .boxHead { fill: #e2e8f0; stroke: #334155; stroke-width: 1.3; rx: 8; }
      .boxTitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .boxText { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #1e293b; }
      .edge { stroke: #334155; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .edgeDashed { stroke: #334155; stroke-width: 1.2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .edgeLabel { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; fill: #0f172a; }
      .lifeline { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .actor { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 6; }
      .note { fill: #fef3c7; stroke: #92400e; stroke-width: 1; rx: 6; }
      .usecase { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="820" />
  <text class="title" x="24" y="34">UML - Diagrama de Sequencia (Salvar Projeto no Builder)</text>

<rect class="actor" x="-25" y="80" width="170" height="28" />
<text class="boxTitle" x="-17" y="98">Usuario</text>
<line class="lifeline" x1="60" y1="108" x2="60" y2="790" />
<rect class="actor" x="237" y="80" width="170" height="28" />
<text class="boxTitle" x="245" y="98">WebBuilderScreen</text>
<line class="lifeline" x1="322" y1="108" x2="322" y2="790" />
<rect class="actor" x="499" y="80" width="170" height="28" />
<text class="boxTitle" x="507" y="98">/api/grape/save</text>
<line class="lifeline" x1="584" y1="108" x2="584" y2="790" />
<rect class="actor" x="761" y="80" width="170" height="28" />
<text class="boxTitle" x="769" y="98">NextAuth</text>
<line class="lifeline" x1="846" y1="108" x2="846" y2="790" />
<rect class="actor" x="1023" y="80" width="170" height="28" />
<text class="boxTitle" x="1031" y="98">Prisma</text>
<line class="lifeline" x1="1108" y1="108" x2="1108" y2="790" />
<rect class="actor" x="1285" y="80" width="170" height="28" />
<text class="boxTitle" x="1293" y="98">PostgreSQL</text>
<line class="lifeline" x1="1370" y1="108" x2="1370" y2="790" />
<line class="edge" x1="60" y1="136" x2="322" y2="136" />
<text class="edgeLabel" x="121" y="129">1: clica em Salvar</text>
<line class="edge" x1="322" y1="178" x2="322" y2="178" />
<text class="edgeLabel" x="252" y="171">2: serializa canvas/schema JSON</text>
<line class="edge" x1="322" y1="220" x2="584" y2="220" />
<text class="edgeLabel" x="383" y="213">3: POST /api/grape/save {name,data,projectId?}</text>
<line class="edge" x1="584" y1="262" x2="846" y2="262" />
<text class="edgeLabel" x="645" y="255">4: auth() para usuario logado</text>
<line class="edgeDashed" x1="846" y1="304" x2="584" y2="304" />
<text class="edgeLabel" x="645" y="297">5: sessao valida</text>
<line class="edge" x1="584" y1="346" x2="584" y2="346" />
<text class="edgeLabel" x="514" y="339">6: valida payload com Zod</text>
<line class="edge" x1="584" y1="388" x2="1108" y2="388" />
<text class="edgeLabel" x="776" y="381">7: findFirst(project by id+user) (se update)</text>
<line class="edge" x1="1108" y1="430" x2="1370" y2="430" />
<text class="edgeLabel" x="1169" y="423">8: SELECT project</text>
<line class="edgeDashed" x1="1370" y1="472" x2="1108" y2="472" />
<text class="edgeLabel" x="1169" y="465">9: resultado</text>
<line class="edgeDashed" x1="1108" y1="514" x2="584" y2="514" />
<text class="edgeLabel" x="776" y="507">10: retorno consulta</text>
<line class="edge" x1="584" y1="556" x2="1108" y2="556" />
<text class="edgeLabel" x="776" y="549">11: create/update grapeProject</text>
<line class="edge" x1="1108" y1="598" x2="1370" y2="598" />
<text class="edgeLabel" x="1169" y="591">12: INSERT/UPDATE grape_projects</text>
<line class="edgeDashed" x1="1370" y1="640" x2="1108" y2="640" />
<text class="edgeLabel" x="1169" y="633">13: projeto salvo</text>
<line class="edgeDashed" x1="1108" y1="682" x2="584" y2="682" />
<text class="edgeLabel" x="776" y="675">14: retorno projeto</text>
<line class="edgeDashed" x1="584" y1="724" x2="322" y2="724" />
<text class="edgeLabel" x="383" y="717">15: 200 {project}</text>
<line class="edgeDashed" x1="322" y1="766" x2="60" y2="766" />
<text class="edgeLabel" x="121" y="759">16: feedback &quot;Salvo&quot;</text>
<rect class="note" x="80" y="740" width="1460" height="58" />
<text class="boxText" x="88" y="758">GET /api/grape/save lista projetos do usuario para dashboard e carregamento no editor.</text>
</svg>
