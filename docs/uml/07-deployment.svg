<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="760" viewBox="0 0 1380 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 8; }
      .boxHead { fill: #e2e8f0; stroke: #334155; stroke-width: 1.3; rx: 8; }
      .boxTitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .boxText { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #1e293b; }
      .edge { stroke: #334155; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .edgeDashed { stroke: #334155; stroke-width: 1.2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .edgeLabel { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; fill: #0f172a; }
      .lifeline { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .actor { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 6; }
      .note { fill: #fef3c7; stroke: #92400e; stroke-width: 1; rx: 6; }
      .usecase { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1380" height="760" />
  <text class="title" x="24" y="34">UML - Diagrama de Deployment</text>

