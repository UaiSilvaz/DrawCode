      .include { stroke: #111827; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-black); }
      .extend { stroke: #1d4ed8; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-blue); }
      .label-inc { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label-ext { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1d4ed8; }

      .actor-head { fill: #ffffff; stroke: #111827; stroke-width: 3; }
