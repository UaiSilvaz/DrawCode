<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 8; }
      .boxHead { fill: #e2e8f0; stroke: #334155; stroke-width: 1.3; rx: 8; }
      .boxTitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .boxText { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #1e293b; }
      .edge { stroke: #334155; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .edgeDashed { stroke: #334155; stroke-width: 1.2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .edgeLabel { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; fill: #0f172a; }
      .lifeline { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .actor { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 6; }
      .note { fill: #fef3c7; stroke: #92400e; stroke-width: 1; rx: 6; }
      .usecase { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1500" height="760" />
  <text class="title" x="24" y="34">UML - Diagrama de Sequencia (Login com Credentials)</text>

<rect class="actor" x="-25" y="80" width="170" height="28" />
<text class="boxTitle" x="-17" y="98">Usuario</text>
<line class="lifeline" x1="60" y1="108" x2="60" y2="730" />
<rect class="actor" x="217" y="80" width="170" height="28" />
<text class="boxTitle" x="225" y="98">LoginPage/ModalLogin</text>
<line class="lifeline" x1="302" y1="108" x2="302" y2="730" />
<rect class="actor" x="459" y="80" width="170" height="28" />
<text class="boxTitle" x="467" y="98">NextAuth</text>
<line class="lifeline" x1="544" y1="108" x2="544" y2="730" />
<rect class="actor" x="701" y="80" width="170" height="28" />
<text class="boxTitle" x="709" y="98">Prisma</text>
<line class="lifeline" x1="786" y1="108" x2="786" y2="730" />
<rect class="actor" x="943" y="80" width="170" height="28" />
<text class="boxTitle" x="951" y="98">PostgreSQL</text>
<line class="lifeline" x1="1028" y1="108" x2="1028" y2="730" />
<rect class="actor" x="1185" y="80" width="170" height="28" />
<text class="boxTitle" x="1193" y="98">Dashboard</text>
<line class="lifeline" x1="1270" y1="108" x2="1270" y2="730" />
<line class="edge" x1="60" y1="136" x2="302" y2="136" />
<text class="edgeLabel" x="111" y="129">1: informa email/senha</text>
<line class="edge" x1="302" y1="178" x2="544" y2="178" />
<text class="edgeLabel" x="353" y="171">2: signIn(&apos;credentials&apos;)</text>
<line class="edge" x1="544" y1="220" x2="786" y2="220" />
<text class="edgeLabel" x="595" y="213">3: findUnique(user by email)</text>
<line class="edge" x1="786" y1="262" x2="1028" y2="262" />
<text class="edgeLabel" x="837" y="255">4: SELECT users</text>
<line class="edgeDashed" x1="1028" y1="304" x2="786" y2="304" />
<text class="edgeLabel" x="837" y="297">5: usuario encontrado</text>
<line class="edgeDashed" x1="786" y1="346" x2="544" y2="346" />
<text class="edgeLabel" x="595" y="339">6: retorna user + hash</text>
<line class="edge" x1="544" y1="388" x2="544" y2="388" />
<text class="edgeLabel" x="474" y="381">7: verifyPassword + callbacks jwt/session</text>
<line class="edgeDashed" x1="544" y1="430" x2="302" y2="430" />
<text class="edgeLabel" x="353" y="423">8: sucesso (sem erro)</text>
<line class="edge" x1="302" y1="472" x2="1270" y2="472" />
<text class="edgeLabel" x="716" y="465">9: router.push(/dashboard)</text>
<rect class="note" x="60" y="680" width="1380" height="48" />
<text class="boxText" x="68" y="698">Se senha invalida: NextAuth retorna erro e a tela exibe &quot;Email ou senha incorretos&quot;.</text>
</svg>
