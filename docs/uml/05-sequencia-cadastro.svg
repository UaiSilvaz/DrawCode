<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="810" viewBox="0 0 1520 810">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 8; }
      .boxHead { fill: #e2e8f0; stroke: #334155; stroke-width: 1.3; rx: 8; }
      .boxTitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .boxText { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #1e293b; }
      .edge { stroke: #334155; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .edgeDashed { stroke: #334155; stroke-width: 1.2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .edgeLabel { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; fill: #0f172a; }
      .lifeline { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .actor { fill: #ffffff; stroke: #334155; stroke-width: 1.3; rx: 6; }
      .note { fill: #fef3c7; stroke: #92400e; stroke-width: 1; rx: 6; }
      .usecase { fill: #ffffff; stroke: #334155; stroke-width: 1.2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1520" height="810" />
  <text class="title" x="24" y="34">UML - Diagrama de Sequencia (Cadastro de Usuario)</text>

<rect class="actor" x="-25" y="80" width="170" height="28" />
<text class="boxTitle" x="-17" y="98">Usuario</text>
<line class="lifeline" x1="60" y1="108" x2="60" y2="780" />
<rect class="actor" x="221" y="80" width="170" height="28" />
<text class="boxTitle" x="229" y="98">RegisterPage/Modal</text>
<line class="lifeline" x1="306" y1="108" x2="306" y2="780" />
<rect class="actor" x="467" y="80" width="170" height="28" />
<text class="boxTitle" x="475" y="98">/api/auth/register</text>
<line class="lifeline" x1="552" y1="108" x2="552" y2="780" />
<rect class="actor" x="713" y="80" width="170" height="28" />
<text class="boxTitle" x="721" y="98">Prisma</text>
<line class="lifeline" x1="798" y1="108" x2="798" y2="780" />
<rect class="actor" x="959" y="80" width="170" height="28" />
<text class="boxTitle" x="967" y="98">PostgreSQL</text>
<line class="lifeline" x1="1044" y1="108" x2="1044" y2="780" />
<rect class="actor" x="1205" y="80" width="170" height="28" />
<text class="boxTitle" x="1213" y="98">NextAuth</text>
<line class="lifeline" x1="1290" y1="108" x2="1290" y2="780" />
<line class="edge" x1="60" y1="136" x2="306" y2="136" />
<text class="edgeLabel" x="113" y="129">1: preenche nome/email/senha</text>
<line class="edge" x1="306" y1="178" x2="552" y2="178" />
<text class="edgeLabel" x="359" y="171">2: POST /api/auth/register</text>
<line class="edge" x1="552" y1="220" x2="552" y2="220" />
<text class="edgeLabel" x="482" y="213">3: rateLimit + validacao Zod</text>
<line class="edge" x1="552" y1="262" x2="798" y2="262" />
<text class="edgeLabel" x="605" y="255">4: findUnique(email)</text>
<line class="edge" x1="798" y1="304" x2="1044" y2="304" />
<text class="edgeLabel" x="851" y="297">5: SELECT users</text>
<line class="edgeDashed" x1="1044" y1="346" x2="798" y2="346" />
<text class="edgeLabel" x="851" y="339">6: nao existe</text>
<line class="edgeDashed" x1="798" y1="388" x2="552" y2="388" />
<text class="edgeLabel" x="605" y="381">7: retorna null</text>
<line class="edge" x1="552" y1="430" x2="552" y2="430" />
<text class="edgeLabel" x="482" y="423">8: hashPassword(bcrypt, salt=12)</text>
<line class="edge" x1="552" y1="472" x2="798" y2="472" />
<text class="edgeLabel" x="605" y="465">9: create(user)</text>
<line class="edge" x1="798" y1="514" x2="1044" y2="514" />
<text class="edgeLabel" x="851" y="507">10: INSERT users</text>
<line class="edgeDashed" x1="1044" y1="556" x2="798" y2="556" />
<text class="edgeLabel" x="851" y="549">11: user criado</text>
<line class="edgeDashed" x1="798" y1="598" x2="552" y2="598" />
<text class="edgeLabel" x="605" y="591">12: retorno user</text>
<line class="edgeDashed" x1="552" y1="640" x2="306" y2="640" />
<text class="edgeLabel" x="359" y="633">13: 201 Conta criada</text>
<line class="edge" x1="306" y1="682" x2="1290" y2="682" />
<text class="edgeLabel" x="728" y="675">14: signIn(credentials)</text>
<rect class="note" x="70" y="725" width="1400" height="58" />
<text class="boxText" x="78" y="743">Se email ja existir, endpoint responde 409. Se validacao falhar, responde 400 com mensagem de erro.</text>
</svg>
